# Local/self-hosted stack: PostgreSQL + web + background worker.
#   docker compose up -d --build
#   docker compose run --rm migrate        # apply migrations + seed
# All configuration comes from the single root .env file.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: koduvai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: koduvai
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koduvai"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: tools }
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts"]
    profiles: ["tools"]

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    env_file: .env
    depends_on: { db: { condition: service_healthy } }
    ports: ["3000:3000"]
    volumes: [uploads:/app/uploads]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s

  worker:
    build: { context: ., target: tools }
    restart: unless-stopped
    env_file: .env
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
  uploads:
